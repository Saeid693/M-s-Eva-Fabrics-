<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>Product Details</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h2>🛍️ Product Details</h2>
  </header>

  <div class="container">
    <a class="back" href="index.html">← Back</a>

    <div class="product">
      <img id="pimg">
      <h3 id="pname"></h3>
      <p class="price" id="pprice"></p>

      <!-- Mini Order Form -->
      <h4>Place Your Order</h4>
      <form id="orderForm">
        <input type="text" id="customerName" placeholder="Your Name" required style="width:100%;padding:8px;margin:5px 0;">
        <input type="tel" id="customerPhone" placeholder="Phone Number" required style="width:100%;padding:8px;margin:5px 0;">
        <input type="number" id="quantity" placeholder="Quantity" value="1" min="1" style="width:100%;padding:8px;margin:5px 0;">
        <button type="submit">Order Now</button>
      </form>
    </div>
  </div>

  <script>
    // URL থেকে প্রোডাক্টের ডেটা নাও
    const params = new URLSearchParams(window.location.search);
    document.getElementById("pname").innerText = params.get("name");
    document.getElementById("pprice").innerText = "৳ " + params.get("price");
    document.getElementById("pimg").src = params.get("img");

    // Mini Order Form দিয়ে WhatsApp লিংক তৈরি
    const form = document.getElementById("orderForm");
    form.addEventListener("submit", function(e){
      e.preventDefault(); // Form submit page reload বন্ধ করবে
      const name = document.getElementById("customerName").value;
      const phone = document.getElementById("customerPhone").value;
      const qty = document.getElementById("quantity").value;
      const product = params.get("name");
      const price = params.get("price");

      const text = `Hello! I want to order:\nProduct: ${product}\nQuantity: ${qty}\nPrice: ৳${price}\nName: ${name}\nPhone: ${phone}`;
      const url = `https://wa.me/8801636939661?text=${encodeURIComponent(text)}`;
      window.location.href = url;
    });
  </script>
</body>
</html>
